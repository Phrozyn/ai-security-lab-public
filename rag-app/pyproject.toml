[project]
name = "ai-security-lab-ragapp"
version = "0.1.0"
description = "RAG app demonstrating retrieval-time ACL enforcement, context redaction, and guardrail scanning"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "click>=8.1",
    # Security floor (transitive via presidio-anonymizer): 48.x carries two fixed
    # High advisories (GHSA-g6cj-pr64-35w5, GHSA-jwv3-5hgf-82ww) caught by the CI
    # Grype gate. Stated here so a re-lock can never regress below it.
    "cryptography>=50.0.0",
]

[project.scripts]
ragapp = "ragapp.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ragapp"

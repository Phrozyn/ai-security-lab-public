# MODEL suite: the gate's tests (tests.yaml) scored on the raw model answers
# the gate run recorded, with no output guard, so it measures the model alone
# on the same generation the gate scored. replay-provider.ts reads the file the
# gate run wrote to REDTEAM_RECORD and makes no model or network call.
# Informational: in CI it runs after the gate in the redteam-live job with
# continue-on-error, and a failure here does not fail the workflow. The gate is
# promptfooconfig.yaml, which applies the app's leak guard. By hand, after a
# gate run with REDTEAM_RECORD=<file>:
#
#   REDTEAM_REPLAY=<file> bunx promptfoo@0.123.1 eval -c ci-cd/redteam/promptfooconfig.model.yaml --no-cache
#
# See promptfooconfig.baseline.yaml for the bare-model probe (expected to fail).

description: ai-security-lab model-only red-team suite (RAG system prompt, gate run's raw answers, no output guard)

providers:
  - id: file://replay-provider.ts
    label: local-gemma raw answers recorded by the gate run

prompts:
  - file://prompt.json

defaultTest:
  assert:
    # An empty/errored output would trivially satisfy every not-icontains, so
    # non-empty output is asserted on every test.
    - type: javascript
      value: "output.trim().length > 0"

tests: file://tests.yaml

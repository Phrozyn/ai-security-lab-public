# LiteLLM proxy config. Full schema: https://docs.litellm.ai/docs/proxy/configs
#
# Routes match what's actually pulled on LLM_HOST (confirmed via `ssh LLM_HOST ollama list`).
# deepseek-v3 (404GB) is intentionally excluded from routing — it doesn't fit the
# 5070's 12GB VRAM and would run almost entirely off system RAM; add it back as a
# route if you specifically want to serve it slowly.

model_list:
  - model_name: local-gemma
    litellm_params:
      model: ollama/gemma4:e2b
      api_base: os.environ/OLLAMA_BASE_URL
      # Ollama models have no published token pricing, so LiteLLM's cost
      # tracking — and therefore per-key max_budget enforcement — is $0/token
      # unless told otherwise. These are internal nominal costs purely so a
      # budget has something to sum against, not real dollar costs.
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.0000015
  - model_name: local-qwen
    litellm_params:
      model: ollama/qwen3.8
      api_base: os.environ/OLLAMA_BASE_URL
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.0000015

general_settings:
  # Master key gates the /key/generate, /key/update, /key/delete admin endpoints.
  # Everyday callers use per-key virtual keys (see scripts/create-key.sh), never
  # the master key itself — the master key should never leave this host.
  master_key: os.environ/LITELLM_MASTER_KEY

  # Required for virtual keys, per-key budgets/rate-limits, and spend logs to work
  # at all — without a DB, LiteLLM only supports the single static master_key.
  database_url: os.environ/DATABASE_URL

  # Audit logging: every request/response is written to the LiteLLM_SpendLogs
  # table in Postgres (queryable via /spend/logs), keyed by virtual key.
  # store_prompts_in_spend_logs also persists prompt/response TEXT, not just
  # metadata — that's a real privacy/data-retention decision, not a free win.
  # Leave it off until there's an explicit retention policy for it (ties to
  # the data-retention requirement in the broader portfolio, see docs/).
  store_prompts_in_spend_logs: false

  # Caps on what a caller can request when generating their own sub-keys
  # (irrelevant unless key self-service is exposed — documented for completeness).
  max_budget: 100
  budget_duration: 30d

litellm_settings:
  # Structured logs make the audit trail machine-parseable (feeds the
  # detections/ Sigma rules component later).
  json_logs: true
  set_verbose: false

# GATE suite: live red-team against the deployed gateway using the RAG app's
# system prompt (prompt.json, generated by sync-prompt.ts, drift-checked in
# CI), with the app's system-prompt leak guard applied to each answer
# (guarded-gateway-provider.ts -> leakguard_gate.py -> ragapp/leakguard.py).
# It tests the answer the app returns. promptfooconfig.model.yaml runs the same
# tests without the guard. Needs a reachable gateway, so it runs on the
# self-hosted runner (CI_RUNNER, over Tailscale) or by hand from a tag:admin machine
# (see ci-cd/README.md "Running the gate by hand"), with a Python 3 on PATH:
#
#   GATEWAY_URL=http://LLM_HOST:4000 GATEWAY_VIRTUAL_KEY=sk-... \
#     bunx promptfoo@0.123.1 eval -c ci-cd/redteam/promptfooconfig.yaml --no-cache
#
# See promptfooconfig.baseline.yaml for the bare-model probe (expected to fail).

description: ai-security-lab gateway red-team gate (RAG system prompt, app leak guard)

providers:
  # Model, temperature 0 and max_tokens 1600 are set in the provider; see the
  # MAX_TOKENS comment there.
  - id: file://guarded-gateway-provider.ts
    label: local-gemma via gateway + app leak guard

prompts:
  - file://prompt.json

defaultTest:
  assert:
    # An empty/errored output would trivially satisfy every not-icontains, so
    # non-empty output is asserted on every test.
    - type: javascript
      value: "output.trim().length > 0"

tests: file://tests.yaml

name: ci

# Merge gates for ai-security-lab. Every action is pinned to a commit SHA
# (version in the trailing comment); every Python tool to an exact version.
# Job-level permissions are minimal; the default token is read-only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- detections
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # uv, pinned by version and archive checksum, creates a per-job virtual environment in
      # RUNNER_TEMP (removed with the job) from a host Python 3.12, or from a uv-managed build
      # when the host has none. setup-python downloads only builds for the platforms in its
      # manifest, which does not cover every self-hosted runner.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          checksum: "b9980552309f09c15172b8be828555e375097f16deb459795ce7bfd200380f0b"
          enable-cache: false
      - name: Python 3.12 virtual environment (uv)
        run: |
          uv --version
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # Two independent checks: the fixture-replay harness proves the rules fire
      # on captured events; pySigma (the authoritative implementation of the
      # Sigma spec) proves the rules are valid Sigma.
      - run: bun detections/validate.ts
      - run: |
          uv pip install --quiet sigma-cli==3.1.0
          sigma check detections/rules/

  # ------------------------------------------------------------ workflow analysis
  # zizmor: static analysis of the workflows and .github/dependabot.yml (template injection,
  # excessive permissions, unpinned or impostor action refs, Dependabot cooldown). The gate
  # runs zizmor on a fixture it must flag and a fixture it must pass before it scans the
  # repository, so a run that reads no files fails instead of passing. GH_TOKEN enables the
  # audits that query the GitHub API (impostor commits, known-vulnerable actions).
  workflow-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # uv, pinned by version and archive checksum, creates a per-job virtual environment in
      # RUNNER_TEMP (removed with the job) from a host Python 3.12, or from a uv-managed build
      # when the host has none. setup-python downloads only builds for the platforms in its
      # manifest, which does not cover every self-hosted runner.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          checksum: "b9980552309f09c15172b8be828555e375097f16deb459795ce7bfd200380f0b"
          enable-cache: false
      - name: Python 3.12 virtual environment (uv)
        run: |
          uv --version
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install --quiet zizmor==1.30.1
      - name: Gate script tests
        run: bun test ci-cd/scripts/zizmor-gate.test.ts
      # The token is set on this step only, not on the install above.
      - name: zizmor (with positive and negative controls)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun ci-cd/scripts/zizmor-gate.ts

  # ------------------------------------------------------------------- secrets
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits via the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted in a later commit is still leaked
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------ model supply chain
  model-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # uv, pinned by version and archive checksum, creates a per-job virtual environment in
      # RUNNER_TEMP (removed with the job) from a host Python 3.12, or from a uv-managed build
      # when the host has none. setup-python downloads only builds for the platforms in its
      # manifest, which does not cover every self-hosted runner.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          checksum: "b9980552309f09c15172b8be828555e375097f16deb459795ce7bfd200380f0b"
          enable-cache: false
      - name: Python 3.12 virtual environment (uv)
        run: |
          uv --version
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: No serialized model artifacts in the repo
        run: bun ci-cd/scripts/check-model-artifacts.ts
      - name: Model lock is well-formed and matches the deployed config
        run: bun ci-cd/scripts/validate-models-lock.ts
      - name: ModelScan (with negative/positive controls)
        run: |
          uv pip install --quiet modelscan==0.8.8
          bun ci-cd/scripts/modelscan-gate.ts

  # ------------------------------------------------------------ container / deps
  # The image list comes from the compose file; this job also fails if any image
  # there is not pinned by digest.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - id: list
        run: bun ci-cd/scripts/list-compose-images.ts
      - name: Image policy check tests
        run: bun test ci-cd/scripts/list-compose-images.test.ts
      - name: Key-creation script tests (stub gateway)
        run: bun test gateway/scripts/create-key.test.ts
      - name: Compose environment allowlist tests
        run: bun test gateway/docker-compose.test.ts

  supply-chain:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy misconfiguration scan (compose + workflows)
        if: strategy.job-index == 0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy image scan -- gate on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      - name: Trivy image scan -- report HIGH (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Resolve image digest for provenance
        env:
          # The image string comes from the compose file; an expression inside the
          # script body would let a changed compose file inject shell.
          IMAGE: ${{ matrix.image }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          docker pull --quiet "$IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | tee "digest-${JOB_INDEX}.txt"

      - name: SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}
          format: cyclonedx-json
          output-file: sbom-image-${{ strategy.job-index }}.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image-${{ strategy.job-index }}
          path: |
            sbom-image-${{ strategy.job-index }}.cdx.json
            digest-*.txt

  python-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SBOM from the hash-pinned lock (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: rag-app
          format: cyclonedx-json
          output-file: sbom-ragapp.cdx.json
          upload-artifact: false
      # A scanner fed an empty SBOM passes everything -- assert the lock was
      # cataloged (presidio is a direct dependency; sanity floor 50).
      - name: SBOM is not empty
        run: |
          n=$(jq '.components | length' sbom-ragapp.cdx.json)
          echo "components: $n"
          [ "$n" -ge 50 ]
          jq -e '.components[] | select(.name == "presidio-analyzer")' sbom-ragapp.cdx.json > /dev/null
      - name: Vulnerability gate on the SBOM (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom-ragapp.cdx.json
          severity-cutoff: high
          only-fixed: true
          fail-build: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-ragapp
          path: sbom-ragapp.cdx.json

  # ------------------------------------------------- deterministic red-team gate
  acl-redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same digest as gateway/docker-compose.yml; ci-cd/scripts/list-compose-images.ts
        # fails the images job when the two differ.
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: ragapp
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: ragapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragapp -d ragapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAGAPP_DATABASE_URL: postgresql://ragapp:ci-only-throwaway@127.0.0.1:5432/ragapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # uv, pinned by version and archive checksum, creates a per-job virtual environment in
      # RUNNER_TEMP (removed with the job) from a host Python 3.12, or from a uv-managed build
      # when the host has none. setup-python downloads only builds for the platforms in its
      # manifest, which does not cover every self-hosted runner.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          checksum: "b9980552309f09c15172b8be828555e375097f16deb459795ce7bfd200380f0b"
          enable-cache: false
      - name: Python 3.12 virtual environment (uv)
        run: |
          uv --version
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install rag-app from the hash-pinned lock
        run: |
          uv pip install --quiet --require-hashes -r rag-app/requirements-lock.txt
          # Presidio's NLP model, pinned by URL and sha256 (not `spacy download`).
          printf '%s\n' 'en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl --hash=sha256:293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63' > /tmp/spacy-model.txt
          uv pip install --quiet --require-hashes --no-deps -r /tmp/spacy-model.txt
          uv pip install --quiet --no-deps -e rag-app
      - name: Live red-team prompt has not drifted from the RAG system prompt
        run: bun ci-cd/redteam/sync-prompt.ts --check
      - name: Guardrail test prompt has not drifted from guardrail_check()
        run: bun ci-cd/redteam/sync-guardrail-prompt.ts --check
      - name: ACL / injection / guardrail / audit red-team harness
        env:
          # psql 16 from the service image runs rag-app/sql/roles.sql; the runner has no psql.
          RAGAPP_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bun ci-cd/acl-redteam/harness.ts
      - name: System-prompt leak guard (deterministic output backstop)
        run: python -m unittest discover -s rag-app/tests -v

  # ------------------------------------------------------- live model red-team
  # Needs the deployed gateway on LLM_HOST, reachable only from a private network, so it
  # runs on the self-hosted runner CI_RUNNER (never on pull_request: a fork PR must not
  # execute on a self-hosted runner). Enabled by the repo variable LLM_HOST_RUNNER=true;
  # LLM_HOST holds the gateway host's address. Until then it is SKIPPED (visibly), not green.
  # Do not make it a required check.
  redteam-live:
    if: ${{ vars.LLM_HOST_RUNNER == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, CI_RUNNER]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # promptfoo must run under Node.js: via bunx on a host without Node it
      # falls back to Bun's runtime, which lacks undici's interceptors.decompress.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Locked model digests match what Ollama is serving
        env:
          LLM_HOST: ${{ vars.LLM_HOST }}
        run: OLLAMA_URL="http://${LLM_HOST}:11434" bun ci-cd/scripts/verify-models.ts
      - name: promptfoo red-team suite (gate, uses the RAG system prompt)
        env:
          GATEWAY_URL: http://${{ vars.LLM_HOST }}:4000
          GATEWAY_VIRTUAL_KEY: ${{ secrets.CI_GATEWAY_VIRTUAL_KEY }}
        run: bunx promptfoo@0.123.1 eval -c ci-cd/redteam/promptfooconfig.yaml --no-cache

  # --------------------------------------------------------------------- signing
  # Keyless cosign (GitHub OIDC -> Fulcio). Keyless signatures are written to the
  # PUBLIC Rekor transparency log, which would disclose this private repo's name
  # and workflow identity -- so the job only runs when the repo is public.
  sign:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && !github.event.repository.private }}
    needs: [detections, workflow-analysis, secrets, model-supply-chain, images, supply-chain, python-deps, acl-redteam]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: attest
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign model lock + SBOMs, then verify what we just signed
        run: |
          set -euo pipefail
          cp ci-cd/models.lock.json attest/
          for f in attest/models.lock.json attest/*.cdx.json; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
            cosign verify-blob \
              --bundle "$f.bundle" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-attestations
          path: attest/
